<!DOCTYPE html>
<html>
<head>
<title>CSC Kerala Portal</title>
<style>
body{font-family:Arial;background:#f3f6fb;margin:0}
header{background:#0a4da3;color:#fff;padding:15px;text-align:center}
section{padding:20px}
h2{background:#0a4da3;color:#fff;padding:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{
background:#fff;
padding:15px;
text-align:center;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
transition:.2s}
.card:hover{transform:scale(1.05)}
a{text-decoration:none;color:#0a4da3;font-weight:bold}
footer{background:#0a4da3;color:#fff;text-align:center;padding:10px}
</style>
</head>
<body>

<header>
<h1>CSC Kerala Portal</h1>
<p>All Online Services in One Place</p>
</header>

<section>
<h2>Government Services</h2>
<div class="grid">
<div class="card"><a href="#">eDistrict</a></div>
<div class="card"><a href="#">Aadhaar</a></div>
<div class="card"><a href="#">Ration Card</a></div>
<div class="card"><a href="#">Land Records</a></div>
</div>
</section>

<section>
<h2>Banking</h2>
<div class="grid">
<div class="card"><a href="#">SBI</a></div>
<div class="card"><a href="#">Federal Bank</a></div>
<div class="card"><a href="#">Canara Bank</a></div>
<div class="card"><a href="#">Indian Bank</a></div>
</div>
</section>

<section>
<h2>Utilities</h2>
<div class="grid">
<div class="card"><a href="#">Electricity</a></div>
<div class="card"><a href="#">Water</a></div>
<div class="card"><a href="#">Gas Booking</a></div>
<div class="card"><a href="#">Mobile Recharge</a></div>
</div>
</section>

<footer>
© 2026 CSC Kerala Portal
</footer>

</body>
</html>
